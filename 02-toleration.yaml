# kubectl taint nodes ip-192-168-18-146.ec2.internal project=roboshop:NoSchedule
apiVersion: v1
kind: Pod
metadata:
  name: nginx-tolerated
  labels:
    env: test
spec:
  containers:
    - name: nginx
      image: nginx
  nodeSelector:
    project: roboshop
  tolerations:
    - key: "project"
      operator: "Equal"
      value: "roboshop"
      effect: "NoSchedule"
